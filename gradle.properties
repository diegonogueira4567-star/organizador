# Dimensionado para uma máquina de 8 GB que também executa um emulador.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
# Compilação Kotlin roda dentro do daemon (2 GB): mais de 2 compilações simultâneas esgotavam a memória
# ("Not enough memory to run compilation"), causando falhas intermitentes de build.
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
